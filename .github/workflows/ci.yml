name: ci

# Preserve native required matrix names while using the configured org pool.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *" # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-matrix:
    # Job name is a REQUIRED status check — keep verbatim fleet-wide.
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
          && fromJSON('["ubuntu-latest"]') || fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize package-owned job state
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?runner must supply writable job scratch}"
          CI_JOB_ROOT="$(mktemp -d "$RUNNER_TEMP/scitex-tex-ci.XXXXXXXX")"
          mkdir -p "$CI_JOB_ROOT/tmp" "$CI_JOB_ROOT/uv-cache" "$CI_JOB_ROOT/cache" \
            "$CI_JOB_ROOT/config" "$CI_JOB_ROOT/mpl" "$CI_JOB_ROOT/scitex-state"
          {
            printf 'TMPDIR=%s\n' "$CI_JOB_ROOT/tmp"
            printf 'UV_CACHE_DIR=%s\n' "$CI_JOB_ROOT/uv-cache"
            printf 'UV_PYTHON_INSTALL_DIR=%s\n' "$CI_JOB_ROOT/uv-python"
            printf 'XDG_CACHE_HOME=%s\n' "$CI_JOB_ROOT/cache"
            printf 'XDG_CONFIG_HOME=%s\n' "$CI_JOB_ROOT/config"
            # Codecov uses git --global; keep its writes off shared HOME.
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$CI_JOB_ROOT/config/gitconfig"
            printf 'MPLCONFIGDIR=%s\n' "$CI_JOB_ROOT/mpl"
            printf 'SCITEX_DIR=%s\n' "$CI_JOB_ROOT/scitex-state"
            printf 'MPLBACKEND=Agg\nRUN_E2E=1\n'
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml
      - name: Install (.[all,dev]) + pytest
        run: |
          set -euo pipefail
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[all,dev]"
          PKG=$(basename "$(find src -maxdepth 1 -mindepth 1 -type d ! -name '*.egg-info' | sort | head -1)")
          # .venv/bin on PATH so tests that spawn the package's console script via
          # subprocess (bare name, e.g. `scitex-dev …`) resolve it — else FileNotFoundError.
          export PATH="$PWD/.venv/bin:$PATH"
          source .github/ci/ensure-tex.sh
          .venv/bin/python -m pytest tests/ --cov="src/$PKG" --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  import-smoke:
    name: import-smoke-on-ubuntu-py3-12
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
          && fromJSON('["ubuntu-latest"]') || fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize package-owned job state
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?runner must supply writable job scratch}"
          CI_JOB_ROOT="$(mktemp -d "$RUNNER_TEMP/scitex-tex-ci.XXXXXXXX")"
          mkdir -p "$CI_JOB_ROOT/tmp" "$CI_JOB_ROOT/uv-cache" "$CI_JOB_ROOT/cache" \
            "$CI_JOB_ROOT/config" "$CI_JOB_ROOT/mpl" "$CI_JOB_ROOT/scitex-state"
          {
            printf 'TMPDIR=%s\n' "$CI_JOB_ROOT/tmp"
            printf 'UV_CACHE_DIR=%s\n' "$CI_JOB_ROOT/uv-cache"
            printf 'UV_PYTHON_INSTALL_DIR=%s\n' "$CI_JOB_ROOT/uv-python"
            printf 'XDG_CACHE_HOME=%s\n' "$CI_JOB_ROOT/cache"
            printf 'XDG_CONFIG_HOME=%s\n' "$CI_JOB_ROOT/config"
            # Codecov uses git --global; keep its writes off shared HOME.
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$CI_JOB_ROOT/config/gitconfig"
            printf 'MPLCONFIGDIR=%s\n' "$CI_JOB_ROOT/mpl"
            printf 'SCITEX_DIR=%s\n' "$CI_JOB_ROOT/scitex-state"
            printf 'MPLBACKEND=Agg\nRUN_E2E=1\n'
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml
      - name: Install (no extras) + import
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e .
          PKG=$(basename "$(find src -maxdepth 1 -mindepth 1 -type d ! -name '*.egg-info' | sort | head -1)")
          .venv/bin/python -c "import importlib; importlib.import_module('$PKG'); print('import OK:', '$PKG')"

  audit:
    name: audit
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
          && fromJSON('["ubuntu-latest"]') || fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize package-owned job state
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?runner must supply writable job scratch}"
          CI_JOB_ROOT="$(mktemp -d "$RUNNER_TEMP/scitex-tex-ci.XXXXXXXX")"
          mkdir -p "$CI_JOB_ROOT/tmp" "$CI_JOB_ROOT/uv-cache" "$CI_JOB_ROOT/cache" \
            "$CI_JOB_ROOT/config" "$CI_JOB_ROOT/mpl" "$CI_JOB_ROOT/scitex-state"
          {
            printf 'TMPDIR=%s\n' "$CI_JOB_ROOT/tmp"
            printf 'UV_CACHE_DIR=%s\n' "$CI_JOB_ROOT/uv-cache"
            printf 'UV_PYTHON_INSTALL_DIR=%s\n' "$CI_JOB_ROOT/uv-python"
            printf 'XDG_CACHE_HOME=%s\n' "$CI_JOB_ROOT/cache"
            printf 'XDG_CONFIG_HOME=%s\n' "$CI_JOB_ROOT/config"
            # Codecov uses git --global; keep its writes off shared HOME.
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$CI_JOB_ROOT/config/gitconfig"
            printf 'MPLCONFIGDIR=%s\n' "$CI_JOB_ROOT/mpl"
            printf 'SCITEX_DIR=%s\n' "$CI_JOB_ROOT/scitex-state"
            printf 'MPLBACKEND=Agg\nRUN_E2E=1\n'
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml
      - name: Install + audit the workspace
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[all,dev]"
          uv pip install --python .venv/bin/python scitex-dev
          # .venv/bin on PATH so audit-all's spawned `scitex-dev` subcommands resolve.
          export PATH="$PWD/.venv/bin:$PATH"
          DIST=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          # --path . audits the CHECKOUT (PR code), not the runner's shared state.
          scitex-dev ecosystem audit-all "$DIST" --path "$PWD"

  docs-sphinx:
    name: docs-sphinx
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
          && fromJSON('["ubuntu-latest"]') || fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize package-owned job state
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?runner must supply writable job scratch}"
          CI_JOB_ROOT="$(mktemp -d "$RUNNER_TEMP/scitex-tex-ci.XXXXXXXX")"
          mkdir -p "$CI_JOB_ROOT/tmp" "$CI_JOB_ROOT/uv-cache" "$CI_JOB_ROOT/cache" \
            "$CI_JOB_ROOT/config" "$CI_JOB_ROOT/mpl" "$CI_JOB_ROOT/scitex-state"
          {
            printf 'TMPDIR=%s\n' "$CI_JOB_ROOT/tmp"
            printf 'UV_CACHE_DIR=%s\n' "$CI_JOB_ROOT/uv-cache"
            printf 'UV_PYTHON_INSTALL_DIR=%s\n' "$CI_JOB_ROOT/uv-python"
            printf 'XDG_CACHE_HOME=%s\n' "$CI_JOB_ROOT/cache"
            printf 'XDG_CONFIG_HOME=%s\n' "$CI_JOB_ROOT/config"
            # Codecov uses git --global; keep its writes off shared HOME.
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$CI_JOB_ROOT/config/gitconfig"
            printf 'MPLCONFIGDIR=%s\n' "$CI_JOB_ROOT/mpl"
            printf 'SCITEX_DIR=%s\n' "$CI_JOB_ROOT/scitex-state"
            printf 'MPLBACKEND=Agg\nRUN_E2E=1\n'
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml
      - name: Build sphinx HTML (satisfies PS-122; RTD bundle stays fresh)
        run: |
          set -euo pipefail
          CONF=""
          for c in docs/sphinx/conf.py docs/conf.py docs/source/conf.py docs/src/conf.py; do
            [ -f "$c" ] && CONF="$c" && break
          done
          if [ -z "$CONF" ]; then
            echo "::error::no Sphinx conf.py found; documentation was not built"
            exit 1
          fi
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[docs]"
          CONFDIR=$(dirname "$CONF")
          # use the `sphinx-build` console script (not `python -m sphinx`) so the
          # auditor's PS-122 detects this workflow runs sphinx-build.
          .venv/bin/sphinx-build -b html "$CONFDIR" "$CONFDIR/_build/html"
