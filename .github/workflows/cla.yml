name: CLA Assistant

# MIGRATED: org-level reusable-workflow caller (scitex-ai/.github).
# Triggers/permissions preserved verbatim from the prior local file.
# Reusable defaults (owner_allowlist="bot*,ywatanabe1989") do NOT match
# this repo's prior hardcoded allowlist (adds LLEmacs), so it is
# overridden below. `runs_on` is passed explicitly (same ubuntu-latest
# the local job used) so the runner decision stays locally visible.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
      runs_on: '["ubuntu-latest"]'
    # NAMED SECRET, not `secrets: inherit`. This caller fires on
    # `issue_comment` and `pull_request_target`, both of which an
    # UNAUTHENTICATED outsider can trigger on a public repo, so `inherit`
    # would forward EVERY secret this repository holds into a job a stranger
    # caused to run. Pass ONLY the one secret the callee declares.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
